[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-and-chains"
dynamic = ["version"]
description = "Chess & Chains – offline-first desktop chess and puzzle prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [{name = "n05a-design"}]
keywords = ["chess", "offline", "desktop", "puzzles", "uci"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
chess-and-chains = "chess_and_chains.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "chess_and_chains.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chess_and_chains.engines" = ["*.json"]
"chess_and_chains.puzzles" = ["data/demo/*.jsonl", "data/demo/*.json"]
"chess_and_chains.ui" = [
    "brand_assets/*.svg", "brand_assets/*.png",
    "piece_assets/*.svg", "piece_assets/*.png", "piece_assets/PROVENANCE.md",
    "piece_assets/top/*.svg", "piece_assets/top/*.png", "piece_assets/top/PROVENANCE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

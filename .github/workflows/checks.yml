name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONWARNINGS: error::ResourceWarning

jobs:
  foundation-docs:
    name: Foundation, status model and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Status model and structure
        run: python scripts/verify_starter.py
      - name: Documentation links
        run: python scripts/verify_document_links.py
      - name: Install test runner
        run: python -m pip install "pytest>=8.4,<10"
      - name: Verify test inventory and runner assignments
        run: python scripts/ci_tests.py inventory
      - name: Pytest-only suites
        run: python scripts/ci_tests.py pytest
      - name: Logo masters and derived brand assets (pixel check, no writes)
        run: python -B scripts/build_brand_assets.py --check

  static-security:
    name: Static checks and security policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all sources
        run: python -m compileall -q src app scripts tests
      - name: Policy scan (no shell=True, no network clients, no bundled engines)
        run: python scripts/check_policy.py

  headless:
    name: Core / UCI / Puzzle / Storage (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Headless test suites
        run: python scripts/ci_tests.py headless

  gui-linux:
    name: Tk GUI tests under Xvfb (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      CHESS_AND_CHAINS_REQUIRE_DISPLAY: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Serial GUI tests
        run: xvfb-run -a python scripts/ci_tests.py gui
      - name: Glide Shell self-test (manifest + 13/13 checks)
        run: xvfb-run -a python -m glide_shell.selftest

  gui-native:
    name: Tk GUI tests native (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    env:
      CHESS_AND_CHAINS_REQUIRE_DISPLAY: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Serial GUI tests
        timeout-minutes: 5
        run: python scripts/ci_tests.py gui
      - name: Glide Shell self-test (manifest + 13/13 checks)
        run: python -m glide_shell.selftest
      - name: Native macOS FEN file panels
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: python scripts/probe_macos_file_dialogs.py
